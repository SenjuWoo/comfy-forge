name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # CPU torch only: the merge tests run on tiny tensors.
      - name: Install merge dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install safetensors numpy pillow

      - name: PowerShell parse gate
        shell: powershell
        run: ./TESTS/Test-PsSyntax.ps1

      - name: Installer gate (no downloads)
        shell: powershell
        run: ./TESTS/Test-AnimaInstall.ps1

      - name: CLI surface (verbs, call graph, error paths)
        shell: powershell
        run: ./TESTS/Test-CliSurface.ps1

      - name: Merge math
        run: python TESTS/test_merge.py

      - name: Merge artifacts (ownership, cleanup, failed copy)
        run: python TESTS/test_merge_artifacts.py

      - name: Model install safety (ownership, crash recovery, real HTTP resume)
        shell: powershell
        run: ./TESTS/Test-ModelInstall.ps1

      - name: Node pack state and clone recovery
        shell: powershell
        run: ./TESTS/Test-NodePackState.ps1

      - name: Shipped workflow converts to an executable graph
        run: python TESTS/test_workflow_convert.py

      - name: 3D generation lock
        run: python TESTS/test_3d_generation.py

      - name: Music (ACE-Step 1.5) generator vs templates vs installer, stub backend
        run: python TESTS/test_music.py

      - name: Music installer (stuck-connection reconnect, resume, size check)
        run: python TESTS/test_music_install.py

      - name: Dataset captions (no tagger weights needed)
        run: python TESTS/test_dataset_prep.py

      - name: Dataset pipeline (inspect, filters, archive layout, validate, launcher)
        run: python TESTS/test_dataset_pipeline.py

      - name: Release identity (VERSION, changelog, STATE)
        shell: powershell
        run: ./TESTS/Test-Release.ps1

      - name: Dependency resolver self-test
        run: python TOOLS/check_deps.py --self-test

      - name: PowerShell 5.1 runtime tests
        shell: powershell
        run: |
          ./TESTS/Test-Mirror.ps1
          ./TESTS/Test-Version.ps1

      - name: Mirror safety (link identity, collisions, cross-volume)
        shell: pwsh
        run: ./TESTS/Test-Mirror.ps1

      - name: Workflow structure and lineage
        shell: pwsh
        run: |
          python TESTS/validate_workflows.py
          $code = $LASTEXITCODE
          if ($code -eq 3) { Write-Host "::warning::workflow topology UNVERIFIED on this runner"; exit 0 }
          if ($code -ne 0) { exit $code }

      - name: Workflow lineage gate self-test (synthetic)
        run: python TESTS/validate_workflows.py --self-test

      - name: Lock validator self-test (mock responses)
        run: python TOOLS/validate-lock.py --self-test

      - name: Dependency lock (pins must resolve upstream)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python TOOLS/validate-lock.py
          $code = $LASTEXITCODE
          if ($code -eq 3) { Write-Host "::warning::lock pins UNVERIFIED (no network)"; exit 0 }
          if ($code -ne 0) { exit $code }

      - name: Version consistency
        shell: pwsh
        run: ./TESTS/Test-Version.ps1

      - name: MCP integration
        shell: pwsh
        timeout-minutes: 6
        run: |
          python TESTS/test_mcp_handshake.py
          $code = $LASTEXITCODE
          if ($code -eq 3) { Write-Host "::warning::MCP real operation UNVERIFIED (no backend)"; exit 0 }
          if ($code -ne 0) { exit $code }
