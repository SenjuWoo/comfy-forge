<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="comfy-kit: Anima starter kit for ComfyUI and SwarmUI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#1b1230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#818cf8" stroke-width="1">
    <path d="M0 240 L1200 60"/><path d="M0 300 L1200 120"/><path d="M0 180 L1200 0"/>
  </g>

  <text x="72" y="132" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1">comfy-kit</text>
  <rect x="74" y="150" width="452" height="5" rx="2.5" fill="url(#accent)" filter="url(#glow)"/>

  <text x="74" y="200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="27" fill="#c7d2fe">Anima starter kit for ComfyUI &amp; SwarmUI</text>
  <text x="74" y="240" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="19" fill="#8ea0c9">install · render · merge checkpoints · wire an agent</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#a5b4fc">
    <rect x="700" y="96" width="196" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="798" y="125" text-anchor="middle">39 presets</text>
    <rect x="916" y="96" width="210" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="1021" y="125" text-anchor="middle">4-way merge</text>
    <rect x="700" y="160" width="196" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="798" y="189" text-anchor="middle">MCP ready</text>
    <rect x="916" y="160" width="210" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="1021" y="189" text-anchor="middle">PowerShell 5.1</text>
  </g>
</svg>
